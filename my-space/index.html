<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Issue Classifier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            resize: none;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #020617;
        }

        .label {
            font-size: 20px;
            font-weight: bold;
        }

        .confidence {
            margin-top: 5px;
        }

        .probabilities {
            margin-top: 10px;
        }

        .probabilities div {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>GitHub Issue Classifier </h1>

    <textarea id="inputText" placeholder="Enter GitHub issue text..."></textarea>

    <button onclick="predict()">Classify</button>

    <div class="result" id="result" style="display:none;">
        <div class="label" id="label"></div>
        <div class="confidence" id="confidence"></div>

        <div class="probabilities" id="probs"></div>
    </div>
</div>

<script>
    async function predict() {
        const text = document.getElementById("inputText").value;
        const resultDiv = document.getElementById("result");

        if (!text.trim()) {
            alert("Please enter some text.");
            return;
        }

        try {
            const response = await fetch("http://127.0.0.1:8000/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ text })
            });

            const data = await response.json();

            // Show result
            resultDiv.style.display = "block";
            document.getElementById("label").innerText = `Label: ${data.label}`;
            document.getElementById("confidence").innerText = `Confidence: ${data.confidence}`;

            // Probabilities
            const probsDiv = document.getElementById("probs");
            probsDiv.innerHTML = "";

            for (const key in data.probabilities) {
                const row = document.createElement("div");
                row.innerHTML = `<span>${key}</span> <span>${data.probabilities[key]}</span>`;
                probsDiv.appendChild(row);
            }

        } catch (error) {
            alert("Error connecting to API");
            console.error(error);
        }
    }
</script>

</body>
</html>
